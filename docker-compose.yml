services:
  db:
    image: postgres:16-alpine
    container_name: pulsecheck-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pulsecheck}
      POSTGRES_USER: ${DB_USER:-pulsecheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pulsecheck_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pulsecheck} -d ${DB_NAME:-pulsecheck}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulsecheck-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pulsecheck}
      DB_USER: ${DB_USER:-pulsecheck}
      DB_PASSWORD: ${DB_PASSWORD:-pulsecheck_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_use_256_bit_secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@pulsecheck.io}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
